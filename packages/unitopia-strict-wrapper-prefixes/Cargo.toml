[package]
name = "unitopia-strict-wrapper-prefixes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.details]
title = ""

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bitcode = { version = "0.6.9", features = ["derive"], optional = true }
num-traits = "0.2.19"
rkyv = { version = "0.8.14", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
unitopia-helpers = { path = "../unitopia-helpers" }
unitopia-strict-wrapper-units = { path = "../unitopia-strict-wrapper-units" }
unitopia-open-wrapper-arith-outputs = { path = "../unitopia-open-wrapper-arith-outputs" }
wincode = { version = "0.3.1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]
bitcode = ["dep:bitcode"]
wincode = ["dep:wincode"]

[package.metadata.cargo-machete]
ignored = ["bitcode", "rkyv", "serde", "wincode"]
